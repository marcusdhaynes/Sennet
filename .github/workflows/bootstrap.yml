name: Bootstrap Sennet source and deploy web
on:
  push:
    branches: [main]
    paths:
      - '.sennet-source.tar.xz.b64'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sennet-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand the complete Sennet project
        if: ${{ hashFiles('.sennet-source.tar.xz.b64') != '' }}
        shell: bash
        run: |
          base64 --decode .sennet-source.tar.xz.b64 > /tmp/sennet-source.tar.xz
          tar -xJf /tmp/sennet-source.tar.xz
          rm .sennet-source.tar.xz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github/workflows'
          git commit -m "Publish full Sennet alpha source" || true
          git push
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run engine tests
        run: npm test
      - name: Build Pages application
        env:
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload browser build
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy Sennet to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
