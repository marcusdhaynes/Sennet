name: Deploy Sennet Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sennet-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Verify the case-sensitive GitHub Pages asset base
        run: |
          grep -Eq 'src="/Sennet/assets/[^"]+\\.js"' apps/web/dist/index.html
          grep -Eq 'href="/Sennet/assets/[^"]+\\.css"' apps/web/dist/index.html
          if grep -q '="/sennet/' apps/web/dist/index.html; then
            echo "ERROR: lowercase /sennet/ would break the canonical /Sennet/ Pages URL" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
